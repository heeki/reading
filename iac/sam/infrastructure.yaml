AWSTemplateFormatVersion: '2010-09-09'
Description: Daily reading infrastructure
Transform: AWS::Serverless-2016-10-31
Parameters:
  domainNameRoot:
    Type: String
  domainNameEmail:
    Type: String
  domainNameApi:
    Type: String
  emailSubject:
    Type: String
  hostedZoneId:
    Type: String
Resources:
  # API Gateway
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref domainNameApi
      DomainValidationOptions:
        - DomainName: !Ref domainNameApi
          HostedZoneId: !Ref hostedZoneId
      ValidationMethod: DNS
      Tags:
        - Key: application:group
          Value: reading
        - Key: application:subgroup
          Value: infrastructure
        - Key: application:owner
          Value: heeki
  Domain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref domainNameApi
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref Certificate
      Tags:
        - Key: application:group
          Value: reading
        - Key: application:subgroup
          Value: api
        - Key: application:owner
          Value: heeki
  DomainRecordSet:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref hostedZoneId
      Name: !Ref domainNameApi
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt Domain.RegionalHostedZoneId
        DNSName: !GetAtt Domain.RegionalDomainName
  # SES
  EmailConfiguration:
    Type: AWS::SES::ConfigurationSet
    Properties:
      DeliveryOptions:
        TlsPolicy: REQUIRE
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      SuppressionOptions:
        SuppressedReasons:
          - BOUNCE
          - COMPLAINT
      VdmOptions:
        DashboardOptions:
          EngagementMetrics: ENABLED
        GuardianOptions:
          OptimizedSharedDelivery: ENABLED
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref EmailConfiguration
      EmailIdentity: !Ref domainNameRoot
      MailFromAttributes:
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
        MailFromDomain: !Ref domainNameEmail
  EmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        SubjectPart: !Sub "${emailSubject} for {{date}}"
        HtmlPart: "<p>{{reading}}</p><br><p><a href='{{complete}}'>Click here when you've completed today's reading</a>.</p><p>To unsubscribe, click <a href='{{unsubscribe}}'>here</a>.<p>"
Outputs:
  outCertificateArn:
    Value: !Ref Certificate
  outEmailIdentity:
    Value: !Ref EmailIdentity
  outEmailTemplate:
    Value: !Ref EmailTemplate